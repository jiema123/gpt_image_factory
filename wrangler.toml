name = "gpt-image-factory"
main = "cloudflare/worker.ts"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./.dist/cloudflare"
binding = "ASSETS"

[vars]
OPENAI_BASE_URL = "https://api.openai.com/v1"
OPENAI_IMAGE_MODEL = "gpt-image-2"

# Persist generated images to R2 so history links survive after the upstream
# provider's temporary URL expires. Create a bucket first:
#   npx wrangler r2 bucket create gpt-image-factory-images
# then uncomment the binding below (bucket_name must match).
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "gpt-image-factory-images"
